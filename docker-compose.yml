# Graph RAG over Aerospace Docs — full local stack.
# Bring up infra first:  docker compose up -d qdrant neo4j postgres ollama otel-collector
# Then app:              docker compose up --build backend frontend

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Qdrant's image is debian-slim and ships no curl/wget/nc/bash — every shell-based
    # healthcheck fails. The service itself is fine; dependents wait on service_started,
    # not service_healthy. Leaving healthcheck off keeps Docker from marking the
    # container "unhealthy" indefinitely.

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please_change_me}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-please_change_me}"
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ingestion:
    build:
      context: .
      dockerfile: ingestion/processing/Dockerfile
    profiles: ["ingest"]   # one-shot; doesn't auto-start with infra
    volumes:
      - ./data:/app/data

  embed:
    build:
      context: .
      dockerfile: embed/Dockerfile
    profiles: ["embed"]    # one-shot; doesn't auto-start with infra
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  retrieve:
    build:
      context: .
      dockerfile: retrieve/Dockerfile
    profiles: ["retrieve"] # one-shot smoke-runner; backend (P6) is the real consumer
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      POSTGRES_DSN: "postgresql://langgraph:${POSTGRES_PASSWORD:-please_change_me}@postgres:5432/langgraph"
      QDRANT_HOST: "qdrant"
      NEO4J_URI: "bolt://neo4j:7687"
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}"
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

  hf-space:
    build:
      context: .
      dockerfile: hf_space/Dockerfile
    profiles: ["hf-space"]
    environment:
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
    ports:
      - "7860:7860"

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
  ollama_models:
